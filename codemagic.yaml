workflows:
  android-debug:
    name: Quotex 99 Android Debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Download Gradle
        script: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-8.7-bin.zip --output /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp
      - name: Build debug APK
        script: |
          set -euo pipefail
          /tmp/gradle-8.7/bin/gradle --no-daemon clean assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/**/mapping.txt
