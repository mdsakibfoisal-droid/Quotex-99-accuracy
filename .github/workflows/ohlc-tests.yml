name: OHLC analysis tests

on:
  push:
    paths:
      - "browser-terminal/ohlc-analysis-engine.js"
      - "browser-terminal/ohlc-analysis-tests.js"
      - "browser-terminal/candle-pattern-matcher.js"
      - "browser-terminal/candle-pattern-matcher-tests.js"
      - ".github/workflows/ohlc-tests.yml"
  pull_request:
    paths:
      - "browser-terminal/ohlc-analysis-engine.js"
      - "browser-terminal/ohlc-analysis-tests.js"
      - ".github/workflows/ohlc-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run OHLC analysis tests
        working-directory: browser-terminal
        run: node ohlc-analysis-tests.js
      - name: Run candle pattern matcher tests
        working-directory: browser-terminal
        run: node candle-pattern-matcher-tests.js
