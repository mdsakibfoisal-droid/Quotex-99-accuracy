name: Q99 browser-terminal checks
on:
  push:
    branches: [feature/market-assistant-demo]
  pull_request:
    branches: [feature/market-assistant-demo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matcher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run matcher tests
        working-directory: browser-terminal
        run: node candle-pattern-matcher-tests.js
      - name: Run bookmarklet syntax and safety checks
        working-directory: browser-terminal
        run: node q99-bookmarklet-tests.js
      - name: Run OHLC feed guard tests
        working-directory: browser-terminal
        run: node ohlc-feed-guard-tests.js
      - name: Validate pattern manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('browser-terminal/pattern-image-manifest.json','utf8')); console.log('Pattern manifest JSON valid')"
